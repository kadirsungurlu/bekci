# Bekci — Docker Compose ile kurulum (SQLite)
# Rehber: https://bekci.app/docs/kurulum/docker-compose/
name: bekci
services:
  bekci:
    # Sürümü sabitlemek için "latest" yerine ör. 1.0.0 yazın.
    image: kadirsungurlu/bekci:latest
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8080:8080"
    environment:
      BASE_URL: http://203.0.113.10:8080   # panelin dışarıdan açıldığı adres
      TZ: Europe/Istanbul
    volumes:
      - bekci-data:/data
      # Pro cihaza bağlı lisans için; yoksa da çalışır.
      - /sys/class/dmi/id/product_uuid:/run/bekci-host/product_uuid:ro
      - /etc/machine-id:/run/bekci-host/machine-id:ro
volumes:
  bekci-data:
