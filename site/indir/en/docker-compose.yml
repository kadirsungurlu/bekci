# Bekci — install with Docker Compose (PostgreSQL + TimescaleDB)
# Guide: https://bekci.app/en/docs/install/docker-compose/
# Change the password in BOTH places the same way (DATABASE_URL and POSTGRES_PASSWORD).
name: bekci
services:
  bekci:
    image: kadirsungurlu/bekci:latest
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8080:8080"
    environment:
      BASE_URL: http://203.0.113.10:8080   # the address you open the panel at
      TZ: Europe/Istanbul
      DATABASE_URL: postgres://bekci:A-STRONG-PASSWORD@db:5432/bekci?sslmode=disable
    volumes:
      - bekci-data:/data   # backups and temporary files
      # Device identity for a device-bound Pro license; works without them too.
      - /etc/machine-id:/run/bekci-host/machine-id:ro
    depends_on:
      db:
        condition: service_healthy
  db:
    image: timescale/timescaledb:2.31.0-pg18
    # With few CPU cores the default 8 workers are too few for maintenance jobs.
    command: postgres -c max_worker_processes=24
    restart: unless-stopped
    environment:
      POSTGRES_USER: bekci
      POSTGRES_PASSWORD: A-STRONG-PASSWORD
      POSTGRES_DB: bekci
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bekci -d bekci"]
      interval: 5s
      retries: 10
volumes:
  bekci-data:
  db-data:
