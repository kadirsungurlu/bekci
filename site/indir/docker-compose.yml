# Bekci — Docker Compose ile kurulum (PostgreSQL + TimescaleDB)
# Rehber: https://bekci.app/docs/kurulum/docker-compose/
# Parolayı İKİ yerde de aynı şekilde değiştirin (DATABASE_URL ve POSTGRES_PASSWORD).
name: bekci
services:
  bekci:
    image: kadirsungurlu/bekci:latest
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8080:8080"
    environment:
      BASE_URL: http://203.0.113.10:8080   # panelin dışarıdan açıldığı adres
      TZ: Europe/Istanbul
      DATABASE_URL: postgres://bekci:GUCLU-BIR-PAROLA@db:5432/bekci?sslmode=disable
    volumes:
      - bekci-data:/data   # yedekler ve geçici dosyalar
      # Pro cihaza bağlı lisans için; yoksa da çalışır.
      - /sys/class/dmi/id/product_uuid:/run/bekci-host/product_uuid:ro
      - /etc/machine-id:/run/bekci-host/machine-id:ro
    depends_on:
      db:
        condition: service_healthy
  db:
    image: timescale/timescaledb:2.31.0-pg18
    # Az çekirdekli sunucuda varsayılan 8 işçi bakım işlerine yetmez.
    command: postgres -c max_worker_processes=24
    restart: unless-stopped
    environment:
      POSTGRES_USER: bekci
      POSTGRES_PASSWORD: GUCLU-BIR-PAROLA
      POSTGRES_DB: bekci
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bekci -d bekci"]
      interval: 5s
      retries: 10
volumes:
  bekci-data:
  db-data:
