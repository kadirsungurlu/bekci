# Testler, arayüz denetimi ve imaj duman testleri her gönderimde (main,
# gelistirme, v* etiketleri) ve her pull request'te çalışır. İmajlar YALNIZCA
# main dalında ve v* etiketlerinde, bunların hepsi geçtikten sonra yüklenir;
# linux/amd64 + linux/arm64, iki kayıt deposuna:
#   docker.io/kadirsungurlu/bekci            (herkese açık, Docker Hub)
#   ghcr.io/<sahip>/bekci
# Etiketler (SQLite | PostgreSQL gömülü):
#   main:        yalnızca ghcr.io'da :<kısa-sha> | :postgres-<kısa-sha>
#   v1.2.3 etiketi: :1.2.3, :1.2, :1, :latest | :1.2.3-postgres, :1.2-postgres,
#                :1-postgres, :postgres (ön sürümde yalnızca tam etiket)
# :latest yalnızca sürüm etiketinden yazılır: içindeki program sürüm numarasını
# bilir (main derlemesi commit kimliğini gösterirdi) ve iki çalıştırma aynı
# etiket için yarışmaz.
# Elle (workflow_dispatch, surum=1.2.3): :latest ve :postgres o sürümün
# imajına yönlendirilir (yeniden derlenmez).
# Docker Hub girişi için repo sırrı: DOCKERHUB_TOKEN (ya da KADIRSUNGURLU).
name: İmajlar

on:
  push:
    branches: [main, gelistirme]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      surum:
        description: ":latest ve :postgres bu sürüme yönlendirilsin (ör. 1.2.1); boş: yalnızca testler"
        required: false
        default: ""
      imza_denetimi:
        description: "Gerçek AGENT_SIGNING_KEY ile imzalı derleme + doğrulama (yüklemez); sürüm etiketinden önce imza hattını dener"
        type: boolean
        default: false

# Aynı dalda yeni bir çalıştırma başlayınca eskisi iptal edilir: eski bir
# commit'in imajı yenisinin üstüne yazılıp :latest geriye gidemez.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: Windows derlemesi (ajan)
        run: GOOS=windows GOARCH=amd64 go vet ./...
      - name: Testler (SQLite)
        run: go test -race -count=1 ./...
      - name: Testler (PostgreSQL)
        env:
          UPTIME_TEST_PG: postgres://postgres:test@localhost:5432/postgres?sslmode=disable
        run: go test -race -count=1 ./...

  arayuz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Tip denetimi (svelte-check)
        run: npm run check
      - name: Derleme
        run: npm run build

  # İmajı derler, çalıştırır ve temel işlevleri dener (yüklemez).
  duman:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            etiket: latest
          - dockerfile: Dockerfile.postgres
            etiket: postgres
    env:
      IMAJ: uptime-duman:${{ matrix.etiket }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          build-args: SOURCE_COMMIT=${{ github.sha }}
          tags: ${{ env.IMAJ }}
          cache-from: type=gha,scope=${{ matrix.etiket }}
          cache-to: type=gha,mode=max,scope=${{ matrix.etiket }}
      - name: Duman testi
        env:
          TUR: ${{ matrix.etiket }}
        run: |
          set -euo pipefail
          docker volume create duman-data
          docker run -d --name duman -p 127.0.0.1:8080:8080 -v duman-data:/data "$IMAJ"

          # /healthz 200 dönene kadar bekle (en fazla 120 sn).
          for _ in $(seq 1 120); do
            kod=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz || true)
            [ "$kod" = 200 ] && break
            sleep 1
          done
          [ "$kod" = 200 ] || { echo "::error::/healthz 200 dönmedi ($kod)"; exit 1; }

          # Sürüm: commit'in kısa özeti gömülü olmalı.
          surum=$(docker exec duman uptime version)
          echo "sürüm: $surum"
          [ "$surum" = "${GITHUB_SHA::7}" ] || { echo "::error::beklenen sürüm ${GITHUB_SHA::7}, gelen $surum"; exit 1; }

          # İlk yönetici + komut satırından şifre sıfırlama (ek bayrak olmadan).
          giris() {
            curl -s -o /dev/null -w '%{http_code}' -X POST -H 'X-Uptime: 1' -H 'Content-Type: application/json' \
              -d "{\"username\":\"duman\",\"password\":\"$1\"}" "http://127.0.0.1:8080/api/auth/$2"
          }
          [ "$(giris eski-sifre-123 setup)" = 200 ] || { echo "::error::ilk kurulum başarısız"; exit 1; }
          printf 'yeni-sifre-456\n' | docker exec -i duman uptime sifre-sifirla duman
          [ "$(giris eski-sifre-123 login)" = 401 ] || { echo "::error::eski şifre hâlâ geçiyor"; exit 1; }
          [ "$(giris yeni-sifre-456 login)" = 200 ] || { echo "::error::yeni şifreyle giriş olmadı"; exit 1; }

          if [ "$TUR" = postgres ]; then
            # Aynı /data'da ikinci container PostgreSQL'i açmamalı: kilidi
            # bekleyip süre dolunca hata ile çıkmalı; ilki çalışmaya devam etmeli.
            docker run -d --name duman-2 -e UPTIME_LOCK_WAIT=5 -v duman-data:/data "$IMAJ"
            cikis=$(timeout 60 docker wait duman-2)
            docker logs duman-2
            [ "$cikis" = 1 ] || { echo "::error::ikinci container beklenmedik çıkış kodu: $cikis"; exit 1; }
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz)" = 200 ] || { echo "::error::ilk container etkilendi"; exit 1; }
          fi

          # Düzgün kapanış.
          docker stop duman
          [ "$(docker inspect duman --format '{{.State.ExitCode}}')" = 0 ] || { echo "::error::kapanış çıkış kodu sıfır değil"; exit 1; }
      # İmza hattı her gönderimde dener (geçici anahtarla): sürüm derlemesindeki
      # imzala + doğrula adımı (Dockerfile) yalnızca etiket/main'de çalıştığından
      # burada olmazsa ilk hata yayın sırasında çıkardı. Gerçek sır için bkz.
      # imza-denetimi işi.
      - name: Ajan imzası (geçici anahtar)
        env:
          DOSYA: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/gecici.pem"
          pub=$(openssl pkey -in "$RUNNER_TEMP/gecici.pem" -pubout -outform DER | tail -c 32 | base64 -w0)
          echo "PUB=$pub" >> "$GITHUB_ENV"
          echo "geçici açık anahtar: $pub"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            VERSION=0.0.0-ci
            AGENT_SIGNING_PUBKEY=${{ env.PUB }}
          secret-files: |
            agent_signing_key=${{ runner.temp }}/gecici.pem
          tags: uptime-imza:${{ matrix.etiket }}
          cache-from: type=gha,scope=${{ matrix.etiket }}
      - name: Ajan imzası doğrula
        run: |
          set -euo pipefail
          n=$(docker run --rm --entrypoint sh "uptime-imza:${{ matrix.etiket }}" -c 'grep -l "\"version\":\"0.0.0-ci\"" /usr/local/share/uptime/agents/*.sig | wc -l')
          echo "imza dosyası: $n"
          [ "$n" -ge 3 ] || { echo "::error::imzalı derlemede ajan imzaları eksik ($n)"; exit 1; }
          docker run --rm --entrypoint uptime "uptime-imza:${{ matrix.etiket }}" version

      - name: Container günlükleri
        if: failure()
        run: docker logs duman || true

  yayinla:
    needs: [test, arayuz, duman]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_IMAGE: docker.io/kadirsungurlu/bekci
    strategy:
      matrix:
        include:
          - dockerfile: Dockerfile
            etiket: latest
            onek: ""
            sonek: ""
          - dockerfile: Dockerfile.postgres
            etiket: postgres
            onek: "postgres-"
            sonek: "-postgres"
    steps:
      - uses: actions/checkout@v5
      # arm64 imajında yalnızca son aşamanın RUN adımı (apk) emülasyonla
      # çalışır; Go ve arayüz derlemesi derleyen makinede (çapraz derleme).
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker Hub: kullanıcı adı sabit; token repo sırrı DOCKERHUB_TOKEN
      # (yoksa KADIRSUNGURLU adıyla eklenmiş sır).
      - uses: docker/login-action@v3
        with:
          username: kadirsungurlu
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.KADIRSUNGURLU }}
      - name: Etiketler
        id: etiket
        env:
          ETIKET: ${{ matrix.etiket }}
          ONEK: ${{ matrix.onek }}
          SONEK: ${{ matrix.sonek }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          kisa=${GITHUB_SHA::7}
          {
            echo "kisa=$kisa"
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "surum=${GITHUB_REF#refs/tags/v}"
            else
              echo "surum="
            fi
            echo "liste<<SON"
            for imaj in "$DOCKERHUB_IMAGE" "ghcr.io/${REPO,,}"; do
              # Commit etiketleri yalnızca ghcr.io'da; Docker Hub'da latest,
              # postgres ve sürüm numaraları görünür.
              # Etiket (v*) çalıştırması commit etiketini yazmaz: aynı commit'i
              # main çalıştırması da derleyip aynı etikete yükler; ikisi yarışıp
              # birbirinin üstüne yazmasın.
              if [ "$imaj" != "$DOCKERHUB_IMAGE" ] && [ "$GITHUB_REF" = refs/heads/main ]; then
                echo "$imaj:${ONEK}${kisa}"
              fi
              if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
                v=${GITHUB_REF#refs/tags/v}
                echo "$imaj:${v}${SONEK}"
                case "$v" in
                  *-*) ;; # ön sürüm (1.2.0-rc1): yalnızca tam etiket
                  *)
                    echo "$imaj:${v%.*}${SONEK}"   # 1.2
                    echo "$imaj:${v%%.*}${SONEK}"  # 1
                    echo "$imaj:${ETIKET}"         # latest | postgres
                    ;;
                esac
              fi
            done
            echo "SON"
          } >> "$GITHUB_OUTPUT"
      # Çok satırlı PEM, build-push-action'ın "secrets:" girdisinde satırlara bölünür
      # (::warning::*** is not a valid secret, imza adımı "PEM bloğu bulunamadı"
      # ile düşer); bu yüzden dosya olarak verilir. İçerik günlüğe yazılmaz.
      - name: İmza anahtarı dosyası
        env:
          SIR: ${{ secrets.AGENT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SIR" ] || { echo "::error::AGENT_SIGNING_KEY sırrı boş ya da tanımsız"; exit 1; }
          f="$RUNNER_TEMP/agent_signing_key.pem"
          ( umask 077; printf '%s\n' "$SIR" > "$f" )
          if ! openssl pkey -in "$f" -noout 2>/dev/null; then
            # Sır base64 olarak saklanmış olabilir.
            ( umask 077; printf '%s' "$SIR" | base64 -d > "$f.2" 2>/dev/null || true )
            if openssl pkey -in "$f.2" -noout 2>/dev/null; then mv "$f.2" "$f"; echo "sır base64'ten çözüldü";
            else echo "::error::AGENT_SIGNING_KEY geçerli bir PKCS#8 PEM özel anahtarı değil (PEM ya da base64 PEM olmalı)"; exit 1; fi
          fi
          echo "AGENT_SIGNING_KEY: geçerli özel anahtar ($(openssl pkey -in "$f" -noout -text 2>/dev/null | head -1))"
      # amd64 katmanları duman testindeki derlemenin önbelleğinden gelir.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            VERSION=${{ steps.etiket.outputs.surum }}
          # Ajan programlarını imzalayan anahtar (otomatik güncelleme; Dockerfile
          # yalnızca sürüm derlemesinde kullanır, katmana girmez).
          secret-files: |
            agent_signing_key=${{ runner.temp }}/agent_signing_key.pem
          tags: ${{ steps.etiket.outputs.liste }}
          # Tedarik zinciri kanıtları: SBOM ve SLSA provenance (Docker Hub gösterir).
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=${{ matrix.etiket }}
            type=gha,scope=${{ matrix.etiket }}-coklu
          cache-to: type=gha,mode=max,scope=${{ matrix.etiket }}-coklu
      - name: Yüklenen imajı iki mimaride çalıştır
        env:
          ONEK: ${{ matrix.onek }}
          KISA: ${{ steps.etiket.outputs.kisa }}
          SURUM: ${{ steps.etiket.outputs.surum }}
          SONEK: ${{ matrix.sonek }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          beklenen=${SURUM:-$KISA}
          # Bu çalıştırmanın yüklediği etiketi dene: sürümde 1.2.3(-postgres),
          # main'de commit etiketi.
          if [ -n "$SURUM" ]; then imaj="$DOCKERHUB_IMAGE:${SURUM}${SONEK}"; else imaj="ghcr.io/${REPO,,}:${ONEK}${KISA}"; fi
          for plat in linux/amd64 linux/arm64; do
            s=$(docker run --rm --pull always --platform "$plat" --entrypoint uptime "$imaj" version)
            echo "$plat: $s"
            [ "$s" = "$beklenen" ] || { echo "::error::$plat sürümü $s (beklenen $beklenen)"; exit 1; }
            # Sürümde ajan imzaları olmalı: yoksa ajanlar otomatik güncellenemez.
            if [ -n "$SURUM" ]; then
              n=$(docker run --rm --platform "$plat" --entrypoint sh "$imaj" -c 'grep -l "\"version\":\"'"$SURUM"'\"" /usr/local/share/uptime/agents/*.sig | wc -l')
              echo "$plat imza dosyası: $n"
              [ "$n" -ge 3 ] || { echo "::error::$plat imajında ajan imzaları eksik ($n); AGENT_SIGNING_KEY sırrını denetleyin"; exit 1; }
            fi
          done

  # Elle (imza_denetimi=true): GERÇEK AGENT_SIGNING_KEY ile sürüm derlemesi,
  # imajın gömülü proje anahtarıyla doğrulaması (Dockerfile "dogrula" adımı
  # tutmazsa derleme düşer); hiçbir yere yüklenmez. Etiket/main'e geçmeden
  # önce sırrın, gömülü açık anahtarın ve imza hattının uyumunu gösterir.
  imza-denetimi:
    if: github.event_name == 'workflow_dispatch' && inputs.imza_denetimi
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            etiket: latest
          - dockerfile: Dockerfile.postgres
            etiket: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # Çok satırlı PEM, build-push-action'ın "secrets:" girdisinde satırlara bölünür
      # (::warning::*** is not a valid secret, imza adımı "PEM bloğu bulunamadı"
      # ile düşer); bu yüzden dosya olarak verilir. İçerik günlüğe yazılmaz.
      - name: İmza anahtarı dosyası
        env:
          SIR: ${{ secrets.AGENT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SIR" ] || { echo "::error::AGENT_SIGNING_KEY sırrı boş ya da tanımsız"; exit 1; }
          f="$RUNNER_TEMP/agent_signing_key.pem"
          ( umask 077; printf '%s\n' "$SIR" > "$f" )
          if ! openssl pkey -in "$f" -noout 2>/dev/null; then
            # Sır base64 olarak saklanmış olabilir.
            ( umask 077; printf '%s' "$SIR" | base64 -d > "$f.2" 2>/dev/null || true )
            if openssl pkey -in "$f.2" -noout 2>/dev/null; then mv "$f.2" "$f"; echo "sır base64'ten çözüldü";
            else echo "::error::AGENT_SIGNING_KEY geçerli bir PKCS#8 PEM özel anahtarı değil (PEM ya da base64 PEM olmalı)"; exit 1; fi
          fi
          echo "AGENT_SIGNING_KEY: geçerli özel anahtar ($(openssl pkey -in "$f" -noout -text 2>/dev/null | head -1))"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            VERSION=0.0.0-imza-denetimi
          secret-files: |
            agent_signing_key=${{ runner.temp }}/agent_signing_key.pem
          tags: uptime-imza:${{ matrix.etiket }}
          cache-from: type=gha,scope=${{ matrix.etiket }}
      - name: İmzalar imajda
        run: |
          set -euo pipefail
          n=$(docker run --rm --entrypoint sh "uptime-imza:${{ matrix.etiket }}" -c 'grep -l "\"version\":\"0.0.0-imza-denetimi\"" /usr/local/share/uptime/agents/*.sig | wc -l')
          echo "IMZA_DENETIMI ${{ matrix.etiket }}: imza dosyası=$n (gömülü proje anahtarıyla doğrulandı)"
          [ "$n" -ge 3 ] || { echo "::error::ajan imzaları eksik ($n)"; exit 1; }

  # Docker Hub depo sayfası (Overview + kısa açıklama) DOCKERHUB.md'den güncellenir.
  # Token'ın "Read, Write, Delete" yetkisi gerekir; yoksa bu adım uyarı verir ama
  # yayını bozmaz.
  dockerhub-sayfa:
    needs: [yayinla]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: peter-evans/dockerhub-description@v4
        with:
          username: kadirsungurlu
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.KADIRSUNGURLU }}
          repository: kadirsungurlu/bekci
          short-description: "Self-hosted uptime & server monitoring. One image, ~15 MB RAM, EN/TR UI. bekci.app"
          readme-filepath: ./DOCKERHUB.md

  # Elle: :latest ve :postgres verilen sürümün imajına yönlendirilir (yeniden
  # derleme yok; aynı manifest, SBOM ve provenance ile).
  latest-yonlendir:
    if: github.event_name == 'workflow_dispatch' && inputs.surum != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          username: kadirsungurlu
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.KADIRSUNGURLU }}
      - name: Yönlendir ve doğrula
        env:
          SURUM: ${{ inputs.surum }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$SURUM" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::geçersiz sürüm: $SURUM"; exit 1; }
          for imaj in docker.io/kadirsungurlu/bekci "ghcr.io/${REPO,,}"; do
            docker buildx imagetools create -t "$imaj:latest" "$imaj:$SURUM"
            docker buildx imagetools create -t "$imaj:postgres" "$imaj:$SURUM-postgres"
          done
          for t in latest postgres; do
            s=$(docker run --rm --pull always --entrypoint uptime "docker.io/kadirsungurlu/bekci:$t" version)
            echo "$t: $s"
            [ "$s" = "$SURUM" ] || { echo "::error::$t sürümü $s (beklenen $SURUM)"; exit 1; }
          done
