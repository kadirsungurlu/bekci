# Uptime: bağımsız bir sunucuya Docker Compose ile kurulum.
#
# İçerik: uygulama (tek imaj) + Caddy (HTTPS sertifikasını Let's Encrypt'ten
# kendisi alır ve yeniler). Coolify gerekmez.
#
# Kurulum:
#   1. Bu klasörü sunucuya kopyalayın; .env.example dosyasını .env olarak
#      kopyalayıp alan adı ve e-postayı yazın.
#   2. Alan adının DNS A kaydı bu sunucunun IP'sini göstermeli; 80 ve 443
#      portları açık olmalı (Cloudflare kullanıyorsanız "DNS only" ile başlayın,
#      sertifika alındıktan sonra proxy açılabilir).
#   3. İmaj GitHub Container Registry'de özel (private) ise önce giriş yapın
#      (read:packages yetkili bir GitHub token'ı ile):
#        echo <token> | docker login ghcr.io -u kadirsungurlu --password-stdin
#   4. docker compose up -d
#   5. https://<alan adı> adresini açıp ilk yönetici hesabını oluşturun.
#
# Güncelleme:
#   0. ÖNCE YEDEK ALIN. Uygulama çalışırken değil, durdurup birimin kopyasını
#      alın (PostgreSQL sürümünde veri klasörü açıkken kopyalanırsa tutarsız
#      olabilir):
#        docker compose stop uptime
#        docker run --rm -v uptime_uptime-data:/data -v "$PWD":/yedek alpine \
#          tar czf /yedek/uptime-data-$(date +%F).tgz -C /data .
#        docker compose start uptime
#      (Birimin tam adı "docker volume ls" ile görülebilir; proje adı "uptime"
#      olduğundan uptime_uptime-data'dır.)
#   1. docker compose pull && docker compose up -d
#
# Sürüm sabitleme ve geri dönüş: her yayın commit kısa özetiyle de etiketlenir
# (SQLite: :<sha>, PostgreSQL: :postgres-<sha>; ör. :abc1234). .env'de
#   UPTIME_TAG=abc1234            (ya da UPTIME_TAG=postgres-abc1234)
# yazarsanız güncelleme siz değiştirene kadar yapılmaz; yeni sürümde sorun
# çıkarsa eski etiketi yazıp "docker compose up -d" ile geri dönebilirsiniz.
# Veritabanı yeni sürümde yükseltildiyse (migration) eski sürüme dönmeden önce
# yukarıdaki yedeği geri yükleyin.
#
# Günlükler:   docker compose logs -f uptime
#
# Şifre sıfırlama (giriş yapılamıyorsa), iki imajda da aynı komut:
#   docker compose exec -it uptime uptime sifre-sifirla <kullanıcı-adı>
#   (iki adımlı doğrulamayı da kapatmak için sona --2fa-kapat ekleyin)
# Compose dışında: docker exec -it <container> uptime sifre-sifirla <kullanıcı-adı>
#
# Veriler "uptime-data" biriminde durur (SQLite veya PostgreSQL veritabanı ve
# uygulamanın günlük yedekleri /data/backups). Sunucu dışına yedeklemek için
# bu birimi (ya da en azından /data/backups klasörünü) düzenli kopyalayın.
#
# Temel imajlar (caddy) digest ile sabitlenmiştir; güncellemek için:
#   docker buildx imagetools inspect caddy:2-alpine → "Digest" satırı.

name: uptime

services:
  uptime:
    # :latest SQLite ile çalışır (önerilen, en hafif). PostgreSQL gömülü sürüm
    # için .env'de UPTIME_TAG=postgres yapın; veriler yine /data altında durur.
    # İki sürümün verisi birbirine taşınmaz: baştan birini seçin.
    image: ghcr.io/kadirsungurlu/uptime-kadir-app:${UPTIME_TAG:-latest}
    restart: unless-stopped
    # Kapanışta uygulama (ve PostgreSQL sürümünde veritabanı) düzgünce
    # kapansın diye 10 sn yerine 30 sn beklenir.
    stop_grace_period: 30s
    environment:
      BASE_URL: https://${UPTIME_DOMAIN:?UPTIME_DOMAIN .env dosyasında tanımlı olmalı}
      TZ: ${TZ:-Europe/Istanbul}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_CONCURRENT_CHECKS: ${MAX_CONCURRENT_CHECKS:-50}
    volumes:
      - uptime-data:/data
    # Dışarıya doğrudan açılmaz; yalnızca Caddy üzerinden erişilir.
    expose:
      - "8080"
    # Sağlık kontrolü imajın içinde tanımlı (/healthz).
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    # caddy:2-alpine
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    depends_on:
      uptime:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      UPTIME_DOMAIN: ${UPTIME_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL .env dosyasında tanımlı olmalı}
      STATUS_DOMAIN: ${STATUS_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  uptime-data:
  caddy-data:
  caddy-config:
