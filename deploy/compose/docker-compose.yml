# Bekci: bağımsız bir sunucuya Docker Compose ile kurulum.
#
# İçerik: uygulama (tek imaj) + PostgreSQL + TimescaleDB (sabit sürüm) + Caddy
# (HTTPS sertifikasını Let's Encrypt'ten kendisi alır ve yeniler). Coolify gerekmez.
#
# Kurulum:
#   1. Bu klasörü sunucuya kopyalayın; .env.example dosyasını .env olarak
#      kopyalayıp alan adı, e-posta ve veritabanı şifresini yazın.
#   2. Alan adının DNS A kaydı bu sunucunun IP'sini göstermeli; 80 ve 443
#      portları açık olmalı (Cloudflare kullanıyorsanız "DNS only" ile başlayın,
#      sertifika alındıktan sonra proxy açılabilir).
#   3. docker compose up -d   (imajlar Docker Hub'dan indirilir, giriş gerekmez)
#   4. https://<alan adı> adresini açıp ilk yönetici hesabını oluşturun.
#
# SQLite ile çalışan eski kurulumdan geçiş: bu dosyayı kullanmadan önce
# "Veritabanı" belgesindeki taşıma adımlarını izleyin (uptime migrate).
# Eski birimdeki dolu SQLite ile boş veritabanı görülürse panel açılmaz.
#
# Güncelleme:
#   0. ÖNCE YEDEK ALIN (veritabanı çalışırken alınır, tutarlıdır):
#        docker compose exec -T db pg_dump -U bekci -Fc bekci > bekci-$(date +%F).dump
#      Panel ayrıca her gece /data/backups altına aynı biçimde yedek yazar.
#   1. docker compose pull && docker compose up -d
#
# Sürüm sabitleme ve geri dönüş: sürümler numarayla (:1.2.3) etiketlenir;
# "latest" son kararlı sürümdür. Geliştirme derlemeleri (commit kısa kodu)
# yalnızca GHCR'dedir: ghcr.io/kadirsungurlu/bekci:abc1234. .env'de
#   UPTIME_TAG=1.2.3
# yazarsanız güncelleme siz değiştirene kadar yapılmaz; yeni sürümde sorun
# çıkarsa eski etiketi yazıp "docker compose up -d" ile geri dönebilirsiniz.
# Veritabanı yeni sürümde yükseltildiyse (migration) eski sürüme dönmeden önce
# yedeği geri yükleyin (bkz. belgeler: Veritabanı).
#
# Günlükler:   docker compose logs -f bekci
#
# Şifre sıfırlama (giriş yapılamıyorsa):
#   docker compose exec -it bekci uptime sifre-sifirla <kullanıcı-adı>
#   (iki adımlı doğrulamayı da kapatmak için sona --2fa-kapat ekleyin)
# Compose dışında: docker exec -it <container> uptime sifre-sifirla <kullanıcı-adı>
#
# Veriler iki birimdedir: "bekci-db" (veritabanı) ve "bekci-data" (günlük
# yedekler /data/backups). Sunucu dışına yedeklemek için /data/backups klasörünü
# düzenli kopyalayın.
#
# Temel imajlar sürüm numarasıyla (db) ya da digest ile (caddy) sabitlenmiştir;
# latest kullanılmaz. Güncellemek için:
#   docker buildx imagetools inspect caddy:2-alpine → "Digest" satırı.

name: bekci

services:
  bekci:
    # Docker Hub (amd64 + arm64). Aynı imaj ghcr.io/kadirsungurlu/bekci'te de var.
    image: kadirsungurlu/bekci:${UPTIME_TAG:-latest}
    restart: unless-stopped
    # Kapanışta uygulama düzgünce kapansın diye 10 sn yerine 30 sn beklenir.
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bekci:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlı olmalı}@db:5432/bekci?sslmode=disable
      BASE_URL: https://${UPTIME_DOMAIN:?UPTIME_DOMAIN .env dosyasında tanımlı olmalı}
      TZ: ${TZ:-Europe/Istanbul}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_CONCURRENT_CHECKS: ${MAX_CONCURRENT_CHECKS:-50}
      # Panel ters vekil arkasında: gerçek ziyaretçi IP'si için vekilin adresi
      # (bu compose ağı; bkz. belgeler: Ortam değişkenleri).
      TRUSTED_PROXY: ${TRUSTED_PROXY:-}
    volumes:
      - bekci-data:/data
      # Pro cihaza bağlı lisans için; yoksa da çalışır.
      - /sys/class/dmi/id/product_uuid:/run/bekci-host/product_uuid:ro
      - /etc/machine-id:/run/bekci-host/machine-id:ro
    # Dışarıya doğrudan açılmaz; yalnızca Caddy üzerinden erişilir.
    expose:
      - "8080"
    # Sağlık kontrolü imajın içinde tanımlı (/healthz).
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  db:
    # Sürüm sabit (latest yok). -oss etiketi kullanılmaz: sıkıştırma ve sürekli
    # özet yoktur. Ana sürümü (pg18) değiştirmek dump/restore ister.
    image: timescale/timescaledb:2.31.0-pg18
    # Az çekirdekli sunucuda varsayılan 8 işçi bakım işlerine yetmez.
    command: postgres -c max_worker_processes=24
    restart: unless-stopped
    # Veritabanı kapanırken bekleyen yazımları diske alır.
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: bekci
      POSTGRES_DB: bekci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlı olmalı}
      # Kullanım verisi Timescale'e gönderilmez.
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      # PostgreSQL 18 imajlarında birim /var/lib/postgresql'e bağlanır (veri
      # /var/lib/postgresql/18/docker altında).
      - bekci-db:/var/lib/postgresql
    # Dışarıya açılmaz; yalnızca compose ağından erişilir.
    expose:
      - "5432"
    healthcheck:
      # TCP ile sorulur: ilk kurulumdaki geçici sunucu yalnız soketi dinler,
      # soketle sorulsa kurulum bitmeden "hazır" görünürdü.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bekci -d bekci"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    # caddy:2-alpine
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    depends_on:
      bekci:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      UPTIME_DOMAIN: ${UPTIME_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL .env dosyasında tanımlı olmalı}
      STATUS_DOMAIN: ${STATUS_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  bekci-db:
  bekci-data:
  caddy-data:
  caddy-config:
